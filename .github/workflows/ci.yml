name: Portfolio CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Run unit tests
        working-directory: client
        run: npm test

      - name: Build production frontend
        working-directory: client
        run: npm run build
